name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The checked-in spec is the TypeScript client's input; regenerate it
      # and fail if the working tree disagrees. Debug build on purpose:
      # skyzen only collects handler metadata when `debug_assertions` is on.
      - name: openapi.json is up to date
        run: |
          cargo run -p flyco-api --bin openapi > openapi.json
          git diff --exit-code openapi.json

  wasm:
    name: Worker target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p flyco-api --target wasm32-unknown-unknown
