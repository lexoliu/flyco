name: CI

# Automatic runs are disabled for now (Lexo, 2026-08-28): private-repo
# Actions minutes are billing-gated on this account. Trigger manually with
# `gh workflow run ci.yml` when needed; restore push/pull_request triggers
# when CI is unblocked. Until then the local per-crate gates carry
# verification.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      # flyco-api embeds frontend/dist (skyzen::embed_dir!), which is
      # gitignored — every job that compiles the crate has to build it first.
      - name: Build the frontend flyco-api embeds
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The checked-in spec is the TypeScript client's input; regenerate it
      # and fail if the working tree disagrees. Debug build on purpose:
      # skyzen only collects handler metadata when `debug_assertions` is on.
      - name: openapi.json is up to date
        run: |
          cargo run -p flyco-api --bin openapi > openapi.json
          git diff --exit-code openapi.json

  sidecar:
    name: Claude Code sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/daemon/sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      # The lockfile is embedded in flycod and reused verbatim when the
      # daemon materializes the sidecar on a VM, so CI must install from it
      # exactly — a drifting lockfile is a drifting deployment.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # Shares fixtures/protocol/ with the Rust `protocol_fixtures` test:
      # both decode and re-encode every message variant, so the two protocol
      # declarations cannot drift apart.
      - run: bun test

  wasm:
    name: Worker target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      # flyco-api embeds frontend/dist (skyzen::embed_dir!), which is
      # gitignored — every job that compiles the crate has to build it first.
      - name: Build the frontend flyco-api embeds
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build
      - run: cargo check -p flyco-api --target wasm32-unknown-unknown

  frontend:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # `src/api/schema.d.ts` is generated from the same `openapi.json` the
      # rust job regenerates, so the two gates together mean the spec, the
      # handlers and the typed client cannot drift apart in any direction.
      - run: bun run api:check
