name: CI

# Automatic runs are disabled for now (Lexo, 2026-08-28): private-repo
# Actions minutes are billing-gated on this account. Trigger manually with
# `gh workflow run ci.yml` when needed; restore push/pull_request triggers
# when CI is unblocked. Until then the local per-crate gates carry
# verification.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `flyco-provider/ssh` is off by default so the Worker build cannot
      # pull an SSH client into a runtime with no sockets. It is enabled
      # here, and only here, so the byo-ssh executor is linted and tested.
      - run: cargo clippy --workspace --all-targets --features flyco-provider/ssh
      - run: cargo test --workspace --features flyco-provider/ssh
      # The checked-in spec is the TypeScript client's input; regenerate it
      # and fail if the working tree disagrees. Debug build on purpose:
      # skyzen only collects handler metadata when `debug_assertions` is on.
      - name: openapi.json is up to date
        run: |
          cargo run -p flyco-api --bin openapi > openapi.json
          git diff --exit-code openapi.json

  sidecar:
    name: Claude Code sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/daemon/sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      # The lockfile is embedded in flycod and reused verbatim when the
      # daemon materializes the sidecar on a VM, so CI must install from it
      # exactly — a drifting lockfile is a drifting deployment.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # Shares fixtures/protocol/ with the Rust `protocol_fixtures` test:
      # both decode and re-encode every message variant, so the two protocol
      # declarations cannot drift apart.
      - run: bun test

  wasm:
    name: Worker target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p flyco-api --target wasm32-unknown-unknown
