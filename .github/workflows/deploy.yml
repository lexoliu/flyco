name: Deploy

# Production deploys happen here and only here: every push to `dev` ships to
# production, and a manual dispatch redeploys the `dev` tip (e.g. after a
# failed run or a secret rotation). The job always checks out the `dev`
# branch tip itself, so what deploys is exactly what merged — never a local
# checkout, a stale branch, or a dirty worktree. AGENTS.md forbids running
# `skyzen deploy` / `wrangler pages deploy` against production locally.
on:
  push:
    branches: [dev]
  workflow_dispatch:

# Deploys serialize: a run that lands while another is in flight queues
# behind it instead of racing it, and still deploys the newest `dev` tip.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Deploy worker and Pages
    runs-on: ubuntu-latest
    # ~10 minutes warm (skyzen-cli binary cached) and ~30 cold; the cap
    # must cover the cold path or a cache flush kills the deploy mid-run.
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned to `dev` rather than `github.sha`: a dispatch must deploy
          # the same thing a push does — the branch tip — never whichever
          # ref the dispatch happened to target.
          ref: dev
      # Seconds rather than a five-minute toolchain install before failing:
      # the deploy cannot authenticate without these.
      - name: Required secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLYCO_DEPLOY_ENV: ${{ secrets.FLYCO_DEPLOY_ENV }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN FLYCO_DEPLOY_ENV; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set — see AGENTS.md → Deployment"
              missing=1
            fi
          done
          exit $missing
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      # flyco-api embeds frontend/dist (skyzen::embed_dir!), so one build
      # feeds both deploy targets: the Worker bundle and Pages.
      - name: Build the frontend
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build
      # The deploy driver. zen-rs/skyzen ships cargo-dist binaries on its
      # releases, so `cargo binstall` downloads a prebuilt `skyzen` in seconds;
      # it falls back to `cargo install` semantics when a release has no
      # artifacts, so a version predating binaries still works. The rust-cache
      # binary check ahead skips even the download on warm runs.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install skyzen-cli
        run: >-
          skyzen --version 2>/dev/null | grep -q '0\.4\.1'
          || cargo binstall --no-confirm --locked skyzen-cli@0.4.1
      # wrangler is what `skyzen deploy` invokes under the hood and what the
      # Pages step calls directly.
      - run: npm install --global wrangler@4
      # `skyzen deploy` expands ${NAME} placeholders in Skyzen.toml from the
      # process environment, then `.env` next to the manifest. The secret is
      # the whole .env file, as crates/api/Skyzen.toml's header prescribes.
      - name: Write the deploy .env
        working-directory: crates/api
        env:
          FLYCO_DEPLOY_ENV: ${{ secrets.FLYCO_DEPLOY_ENV }}
        run: printf '%s\n' "$FLYCO_DEPLOY_ENV" > .env
      # The schema goes first and the code second, so a deploy never runs
      # code against a database that lacks its columns (issue #363: three
      # migrations shipped behind their code and every minute cron and every
      # budget read failed until they were applied by hand). `skyzen
      # migrate` is `wrangler d1 migrations apply --remote` on every
      # database the manifest declares, from its `migrations_dir`; a
      # migration that fails stops the deploy here, with the old code still
      # serving.
      - name: Apply D1 migrations
        working-directory: crates/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: skyzen migrate
      - name: Deploy the worker
        working-directory: crates/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: skyzen deploy
      # The Pages project was created with `main` as its production branch
      # (the git default branch here is `dev`), so deployments must name
      # `main` to reach production; `--branch dev` would land on a preview
      # alias instead. The commit hash is recorded for provenance.
      - name: Deploy Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          wrangler pages deploy dist
          --project-name flyco
          --branch main
          --commit-hash "$(git rev-parse HEAD)"
      # Cloudflare's edge caches and route tables take a few seconds to pick
      # up a new version; retry before judging.
      - name: Smoke-check the deployment
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/config.json -w '%{http_code}' https://dev.flyco.dev/v1/config) && \
              [ "$code" = 200 ] && \
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://dev.flyco.dev/v1/auth/github/start -H 'content-type: application/json' -d '{}') && \
              [ "$code" = 400 ] && exit 0
            sleep 5
          done
          echo "deployment did not pass smoke check" >&2
          exit 1
