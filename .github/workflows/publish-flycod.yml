name: Publish flycod

# Dispatch only. Automatic runs are off across this repository (Lexo,
# 2026-08-28: private-repo Actions minutes are billing-gated), and a release
# is a deliberate act in any case: publishing a daemon is what every machine
# provisioned afterwards will run. Trigger with
# `gh workflow run publish-flycod.yml`, or from the Actions tab.
#
# The job runs exactly the same `cargo xtask publish-flycod` a developer runs
# locally, so there is one implementation of the procedure and this file only
# supplies the toolchain and the credentials.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish to
        type: choice
        options:
          - dev
        default: dev
      dry_run:
        description: Build and checksum without uploading
        type: boolean
        default: false
      allow_wire_mismatch:
        description: Publish even if the control plane speaks another wire protocol version
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Cross-compile and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # zig is the cross-linker; `cargo-zigbuild` is the cargo wrapper that
      # drives it and applies the `.2.31` glibc pin. The prebuilt binary
      # keeps a release from paying a source build of the tool.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # wrangler performs the four `r2 object put` calls. Installed globally
      # so it is on PATH under the name the xtask executes.
      - run: npm install --global wrangler@4
      - name: cargo xtask publish-flycod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          cargo xtask publish-flycod
          --channel ${{ inputs.channel }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.allow_wire_mismatch && '--allow-wire-mismatch' || '' }}
