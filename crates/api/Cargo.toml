[package]
name = "flyco-api"
description = "Flyco control plane: the REST API, session relay, and budget accounting running on Cloudflare Workers via skyzen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `sql` carries the column mapping of the stored domain types; see that
# crate's manifest for why it is a feature rather than always on.
flyco-core = { workspace = true, features = ["sql"] }
# Default features only: the `ssh` executor must never reach the Worker build.
flyco-provider.workspace = true
skyzen.workspace = true
skyzen-services.workspace = true
zenwave.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

aes-gcm.workspace = true
# The one thing the control plane renders rather than serializes: the notice
# a CI failure wakes a session with. A compiled template keeps its layout in
# a file the build checks instead of in a `format!` chain.
askama.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
url.workspace = true
utoipa.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
skyzen-cloudflare.workspace = true

# The native binary exists for `skyzen dev` and the `openapi.json` export. Its
# portable-service wiring in `Skyzen.toml` resolves to skyzen's in-memory KV
# (which lives in `skyzen-test`) and a local SQLite file, so both crates are
# real dependencies of the native build — and of the native build only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `ssh` only off the Worker. A registered host is reached over TCP, which the
# Worker has none of, so `SshExecutor` exists exactly where a connection can be
# opened — and the Worker's dependency graph still contains no SSH client.
flyco-provider = { workspace = true, features = ["ssh"] }
skyzen-services = { workspace = true, features = [
    "sqlite",
    "runtime-async-std-rustls",
] }
skyzen-test.workspace = true

[features]
default = ["openapi"]
# `#[skyzen::openapi]` expands to items gated on `#[cfg(feature = "openapi")]`
# without a crate qualifier, so the gate resolves against the *consuming*
# crate. flyco-api must therefore declare an `openapi` feature of its own or
# every annotated handler references a schema function that was cfg'd away.
openapi = []

[dev-dependencies]
skyzen-test = { workspace = true, features = ["runtime-tokio-rustls"] }

[lints]
workspace = true
