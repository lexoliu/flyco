[package]
name = "flyco-api"
description = "Flyco control plane: the REST API, session relay, and budget accounting running on Cloudflare Workers via skyzen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `sql` carries the column mapping of the stored domain types; see that
# crate's manifest for why it is a feature rather than always on.
flyco-core = { workspace = true, features = ["sql"] }
flyco-provider.workspace = true
skyzen.workspace = true
skyzen-services.workspace = true
zenwave.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

aes-gcm.workspace = true
# The one thing the control plane renders rather than serializes: the notice
# a CI failure wakes a session with. A compiled template keeps its layout in
# a file the build checks instead of in a `format!` chain.
askama.workspace = true
base64.workspace = true
# The one clock that can wait on both targets: `setTimeout` on wasm32, a
# real timer natively. It drives the cadence and heartbeats of the streams
# `sse.rs` serves — the daemon's command stream, a desktop watch, a held
# workdir question.
futures-timer.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
sha2.workspace = true
url.workspace = true
utoipa.workspace = true
# The GUID a role assignment is addressed by: Azure creates one by `PUT`ting
# to a name the caller mints, so a fresh v4 UUID is how one is created.
uuid.workspace = true
jwt-compact.workspace = true
web-push-native.workspace = true
serde_urlencoded = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
skyzen-cloudflare.workspace = true
# Must equal the generator `skyzen` embeds — `skyzen doctor` reports the
# version to use, and a mismatch fails as an opaque wasm-bindgen schema error.
wasm-bindgen = "=0.2.120"
# Worker-side tracing: `console.*` is what Workers Logs retains (flyco #119).
tracing-subscriber.workspace = true
tracing-web = "0.1"
console_error_panic_hook = "0.1"

# The native binary exists for `skyzen dev` and the `openapi.json` export. Its
# portable-service wiring in `Skyzen.toml` resolves to skyzen's in-memory KV
# (which lives in `skyzen-test`) and a local SQLite file, so both crates are
# real dependencies of the native build — and of the native build only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The global executor the native runtime installs at start-up — `sse::serve`
# spawns a stream's polling task onto it. The version matches skyzen's own
# dependency so both resolve to one `GLOBAL_EXECUTOR`.
executor-core = { version = "0.7.1", default-features = false, features = ["std"] }
skyzen-services = { workspace = true, features = [
    "sqlite",
    "runtime-async-std-rustls",
] }
skyzen-test.workspace = true
zenwave = { workspace = true, features = ["hyper-rustls"] }

[features]
default = ["openapi"]
# `#[skyzen::openapi]` expands to items gated on `#[cfg(feature = "openapi")]`
# without a crate qualifier, so the gate resolves against the *consuming*
# crate. flyco-api must therefore declare an `openapi` feature of its own or
# every annotated handler references a schema function that was cfg'd away.
openapi = []

[dev-dependencies]
skyzen-test = { workspace = true, features = ["runtime-tokio-rustls"] }
# The recorded transport the Anthropic OAuth client is pinned against, the
# same one every provider driver is tested with.
flyco-provider = { workspace = true, features = ["testing"] }

[lints]
workspace = true
