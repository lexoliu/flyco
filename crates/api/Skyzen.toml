# Deployment manifest for the flyco control plane (crates/api).
# Services (KV, D1, R2, Queues, Durable Objects) are added as milestones land.
#
# Deploying requires the Cloudflare resources to exist first — skyzen has no
# provisioning of its own, so the ids below are pasted in by hand:
#
#   wrangler kv namespace create flyco-auth   -> cloudflare.kv_namespaces.id
#   wrangler d1 create flyco-main             -> cloudflare.d1_databases.database_id
#   wrangler d1 migrations apply flyco-main   -> applies migrations/0001_init.sql
#
# Deploy-time values are `${NAME}` placeholders. `skyzen deploy` expands them
# from the process environment, then `.env` / `.env.local`. GitHub Actions
# can write one repository secret as that `.env` file. `#[skyzen::main]` does
# not expand placeholders, so `cargo build` never needs them.
#
# Worker secrets never live in this file:
#   skyzen secret set FLYCO_GITHUB_CLIENT_SECRET
#   skyzen secret set FLYCO_ENCRYPTION_KEY          # 32 bytes, hex-encoded
#   skyzen secret set FLYCO_VAPID_PRIVATE_KEY       # raw P-256 base64url
#   skyzen secret set FLYCO_GITHUB_WEBHOOK_SECRET
#   skyzen secret set FLYCO_AZURE_OAUTH_CLIENT_SECRET
#   skyzen secret set FLYCO_GOOGLE_OAUTH_CLIENT_SECRET
# FLYCO_GITHUB_CLIENT_ID is shared across dev/nightly/production: one GitHub
# OAuth app with a callback URI per hostname.
#
# FLYCO_GITHUB_WEBHOOK_SECRET is the secret GitHub signs webhook deliveries
# with. It is required because a deployment without it cannot authenticate
# this public endpoint and must not start in a partially functional state.
#
# Turnstile gates sign-in the same way:
#   skyzen secret set FLYCO_TURNSTILE_SECRET
# The sitekey is a var — it is public by design — and so is the comma-
# separated hostname allowlist a verified token may have been minted on.

# The KV namespace is a portable service, so `#[skyzen::main]` wires it.
[[service]]
name = "auth_kv"
type = "kv"

# The control plane's one SQL database: D1 on the Worker, a SQLite file
# natively. `default = true` is what makes a handler's bare `Db` argument
# resolve to it, so nothing names the binding outside this file.
#
# `migrations/` at the repo root is the default directory, and the same one
# `wrangler d1 migrations apply` reads.
[[database]]
name = "main"
type = "sql"
default = true
migrations_dir = "../../migrations"

# R2 holds session transcripts: `transcripts/{session}/{stream}/{seq:08}.jsonl`,
# written batch by batch by flycod. Bulk transcript data must never ride the
# relay — its frames are sequenced envelopes, not a bulk pipe — so this is the
# write path for History, and the read path a session resuming onto a new
# machine uses.
#
#   wrangler r2 bucket create flyco-transcripts
[[service]]
name = "transcripts"
type = "storage"

# The provisioning queue. `POST /v1/sessions` and `POST
# /v1/sessions/{id}/resume` enqueue one job per machine; the `#[skyzen::queue]`
# consumer in `flyco_api::provisioning_queue` performs it. It is a queue rather
# than a synchronous call because a provision is minutes long — an Azure
# machine took over five in a live test — and a Worker request cannot wait on
# that.
#
#   wrangler queues create flyco-provisioning
[[service]]
name = "provisioning"
type = "queue"

# Native wiring exists for `skyzen dev` and the openapi.json export. `memory`
# resolves to skyzen-test's in-memory KV, which is why skyzen-test is a
# dependency of the native target only.
[native.service.auth_kv]
backend = "memory"

# The queue has the same in-memory backend natively, so `skyzen dev` and the
# crate's own tests enqueue and drain the same instance. There is deliberately
# no `[[native.queue_consumer]]`: a natively-driven handler may take nothing
# but the batch, and this one needs the Worker environment to open D1 and read
# its configuration, so the loop is Cloudflare's. Natively the consumer is
# driven directly — see `flyco_api::provisioning_queue::consume`.
[native.service.provisioning]
backend = "memory"

# Same story for R2: the only other storage backend is S3, which would drag
# `skyzen-s3` into the native build for no benefit — `skyzen dev` wants a
# scratch bucket, not a real one.
[native.service.transcripts]
backend = "memory"

# Natively the same schema runs on a local SQLite file.
[native.database.main]
backend = "sqlite"
url_env = "FLYCO_DATABASE_URL"

[cloudflare]
name = "flyco"
compatibility_date = "2026-07-15"
account_id = "${CLOUDFLARE_ACCOUNT_ID}"
workers_dev = true

[cloudflare.triggers]
crons = ["* * * * *"]

[cloudflare.vars]
FLYCO_GITHUB_CLIENT_ID = "${FLYCO_GITHUB_CLIENT_ID}"
FLYCO_REDIRECT_URI = "${FLYCO_REDIRECT_URI}"
FLYCO_VAPID_SUBJECT = "mailto:me@lexo.cool"
# The OAuth client the Claude sign-in presents to Anthropic. A var rather
# than a secret: the flow is a public client with PKCE, and Anthropic issues
# no client secret for it. `.env.example` carries the default — the Claude
# Code CLI's own client id — so a deployment only sets this to present a
# client it registered itself.
FLYCO_CLAUDE_OAUTH_CLIENT_ID = "${FLYCO_CLAUDE_OAUTH_CLIENT_ID}"
# The OAuth client the Codex sign-in presents to OpenAI. A var for the same
# reason: the device flow is a public client and OpenAI issues no client
# secret for it. `.env.example` carries the default — the Codex CLI's own
# client id.
FLYCO_CODEX_OAUTH_CLIENT_ID = "${FLYCO_CODEX_OAUTH_CLIENT_ID}"
# The application "Sign in with Microsoft" presents. Unlike the harness
# clients this one is confidential — the flow is a redirect with a callback
# flyco serves, so Microsoft issues a client secret, and only the id is a
# var. Register the callback as
# `<FLYCO_REDIRECT_URI origin>/v1/providers/azure/oauth/callback`.
FLYCO_AZURE_OAUTH_CLIENT_ID = "${FLYCO_AZURE_OAUTH_CLIENT_ID}"
# The client "Sign in with Google" presents, with its callback at
# `<FLYCO_REDIRECT_URI origin>/v1/providers/gcp/oauth/callback`.
FLYCO_GOOGLE_OAUTH_CLIENT_ID = "${FLYCO_GOOGLE_OAUTH_CLIENT_ID}"

# The Turnstile sitekey the login page renders — public by design, so a
# var — and the hostnames a verified token may have been minted on. The
# secret half is `skyzen secret set FLYCO_TURNSTILE_SECRET`, above.
FLYCO_TURNSTILE_SITEKEY = "${FLYCO_TURNSTILE_SITEKEY}"
FLYCO_TURNSTILE_HOSTNAMES = "${FLYCO_TURNSTILE_HOSTNAMES}"

# `dev.flyco.dev` belongs to the `flyco` Pages project, which serves the PWA
# and proxies `/v1/*` and `/install/*` here — the Worker keeps no hostname of
# its own, so nothing below routes a domain at it.
# Workers Logs: every invocation's logs and exceptions are stored and
# searchable in the dashboard (Workers & Pages → flyco → Logs), not only
# visible while someone runs `wrangler tail`. Sampling 1 keeps all of them.
[cloudflare.raw.observability]
enabled = true
head_sampling_rate = 1

# The per-minute request limits (issue #342), one Rate Limiting binding per
# class of caller because a binding carries exactly one limit. Counted in
# memory per location by the platform and free, they are the bound that is
# checked before any storage is read. The numbers must equal
# `flyco_api::request_budget::Limits::PRODUCTION`, which a test in that
# module asserts by reading this file. `namespace_id` is any integer unique
# in the account; two bindings sharing one would share counters.
[[cloudflare.raw.ratelimits]]
name = "LIMIT_USERS"
namespace_id = "3421"
simple = { limit = 300, period = 60 }

[[cloudflare.raw.ratelimits]]
name = "LIMIT_DAEMONS"
namespace_id = "3422"
simple = { limit = 240, period = 60 }

[[cloudflare.raw.ratelimits]]
name = "LIMIT_HOSTS"
namespace_id = "3423"
simple = { limit = 60, period = 60 }

[[cloudflare.raw.ratelimits]]
name = "LIMIT_PUBLIC"
namespace_id = "3424"
simple = { limit = 60, period = 60 }

[cloudflare.service.auth_kv]
binding = "AUTH_KV"

[cloudflare.service.transcripts]
binding = "TRANSCRIPTS"

[cloudflare.service.provisioning]
binding = "PROVISIONING"

[cloudflare.database.main]
binding = "DB"

[[cloudflare.kv_namespaces]]
binding = "AUTH_KV"
id = "${FLYCO_AUTH_KV_ID}"

[[cloudflare.r2_buckets]]
binding = "TRANSCRIPTS"
bucket_name = "flyco-transcripts"

[[cloudflare.d1_databases]]
binding = "DB"
database_name = "flyco-main"
database_id = "${FLYCO_D1_DATABASE_ID}"

# The Worker is both ends of the provisioning queue: `POST /v1/sessions`
# produces through the `PROVISIONING` binding, and the exported `queue` handler
# consumes from the same queue.
[[cloudflare.queues.producers]]
binding = "PROVISIONING"
queue = "flyco-provisioning"

# One invocation at a time, because two deliveries of the same job racing each
# other is the one case the machine row's UNIQUE index cannot arbitrate on D1,
# which has no transactions. The retries are an infrastructure backstop only:
# the consumer counts its own attempts inside the job and re-enqueues, so a
# provision that keeps failing ends as a visibly failed session rather than as
# a message Cloudflare quietly stops redelivering.
[[cloudflare.queues.consumers]]
queue = "flyco-provisioning"
max_batch_size = 1
max_concurrency = 1
max_retries = 3

# One Durable Object per session: the live relay room. The daemon attaches
# over REST, holds an SSE command stream, and posts its frames back in
# sequenced batches; browsers never touch the room — every command lands
# as an `/internal/*` route from the Worker and every event leaves on the
# owner's user stream. It is addressed by the session id (`get_by_name`),
# so a session and its room are the same identity.
#
# The binding names the Rust type. `#[skyzen::durable_object]` on `T`
# exports the JS class as `TObject`; skyzen-cli re-exports that as `T`
# for wrangler, so `class_name` is `SessionRoom`.
[[cloudflare.durable_objects.bindings]]
name = "SESSION_ROOMS"
class_name = "SessionRoom"

# One Durable Object per enrolled machine: the host relay room. `flycod
# host` attaches over REST, holds an SSE command stream, and posts its
# frames back; the Worker queues container jobs through `/internal/command`
# and the room holds a job until the machine answers it. It is also the
# only thing that can see whether a machine is attached at all — a Durable
# Object cannot reach D1, so the `hosts` row is refreshed from the room
# every time the Worker looks at it.
#
# Addressed by the host id (`get_by_name`), so a machine and its room are
# the same identity.
[[cloudflare.durable_objects.bindings]]
name = "HOST_ROOMS"
class_name = "HostRoom"

# One Durable Object per user: the fan-in for `GET /v1/events`. A session
# room cannot reach the user it belongs to, so the Worker publishes each
# call's events here and a browser holds one SSE connection for everything
# it owns. Addressed by the user id (`get_by_name`).
[[cloudflare.durable_objects.bindings]]
name = "USER_EVENTS"
class_name = "UserEvents"

[[cloudflare.durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

# A second tag rather than an edit to `v1`: a migration that has been applied
# is history, and rewriting it would leave the deployed namespace and this
# file describing different things.
[[cloudflare.durable_objects.migrations]]
tag = "v2"
new_sqlite_classes = ["HostRoom"]

[[cloudflare.durable_objects.migrations]]
tag = "v3"
new_sqlite_classes = ["UserEvents"]
