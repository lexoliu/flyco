# Deployment manifest for the flyco control plane (crates/api).
# Services (KV, D1, R2, Queues, Durable Objects) are added as milestones land.
#
# Deploying requires the Cloudflare resources to exist first — skyzen has no
# provisioning of its own, so the ids below are pasted in by hand:
#
#   wrangler kv namespace create flyco-auth   -> cloudflare.kv_namespaces.id
#   wrangler d1 create flyco-main             -> cloudflare.d1_databases.database_id
#   wrangler d1 migrations apply flyco-main   -> applies migrations/0001_init.sql
#
# Until that happens every unprovisioned value reads "TO-BE-PROVISIONED".
#
# Secrets never live in this file. Before the first deploy:
#   wrangler secret put FLYCO_GITHUB_CLIENT_SECRET
#   wrangler secret put FLYCO_ENCRYPTION_KEY          # 32 bytes, hex-encoded
#   wrangler secret put FLYCO_GITHUB_WEBHOOK_SECRET   # optional; see below
# Only the two non-secret values are declared under [cloudflare.vars].
#
# FLYCO_GITHUB_WEBHOOK_SECRET is the secret GitHub signs webhook deliveries
# with, and it is optional in one direction only: without it this deployment
# has nothing to verify a delivery against, so it accepts no webhooks at all
# rather than reading an unsigned body.

# The KV namespace is a portable service, so `#[skyzen::main]` wires it.
[[service]]
name = "auth_kv"
type = "kv"

# The control plane's one SQL database: D1 on the Worker, a SQLite file
# natively. `default = true` is what makes a handler's bare `Db` argument
# resolve to it, so nothing names the binding outside this file.
#
# `migrations/` at the repo root is the default directory, and the same one
# `wrangler d1 migrations apply` reads.
[[database]]
name = "main"
type = "sql"
default = true

# R2 holds session transcripts: `transcripts/{session}/{stream}/{seq:08}.jsonl`,
# written batch by batch by flycod. Bulk transcript data must never ride the
# relay WebSocket — Cloudflare caps a frame at 1 MiB — so this is the write
# path for History, and the read path a session resuming onto a new machine
# uses.
#
#   wrangler r2 bucket create flyco-transcripts
[[service]]
name = "transcripts"
type = "storage"

# The provisioning queue. `POST /v1/sessions` and `POST
# /v1/sessions/{id}/resume` enqueue one job per machine; the `#[skyzen::queue]`
# consumer in `flyco_api::provisioning_queue` performs it. It is a queue rather
# than a synchronous call because a provision is minutes long — an Azure
# machine took over five in a live test — and a Worker request cannot wait on
# that.
#
#   wrangler queues create flyco-provisioning
[[service]]
name = "provisioning"
type = "queue"

# Native wiring exists for `skyzen dev` and the openapi.json export. `memory`
# resolves to skyzen-test's in-memory KV, which is why skyzen-test is a
# dependency of the native target only.
[native.service.auth_kv]
backend = "memory"

# The queue has the same in-memory backend natively, so `skyzen dev` and the
# crate's own tests enqueue and drain the same instance. There is deliberately
# no `[[native.queue_consumer]]`: a natively-driven handler may take nothing
# but the batch, and this one needs the Worker environment to open D1 and read
# its configuration, so the loop is Cloudflare's. Natively the consumer is
# driven directly — see `flyco_api::provisioning_queue::consume`.
[native.service.provisioning]
backend = "memory"

# Same story for R2: the only other storage backend is S3, which would drag
# `skyzen-s3` into the native build for no benefit — `skyzen dev` wants a
# scratch bucket, not a real one.
[native.service.transcripts]
backend = "memory"

# Natively the same schema runs on a local SQLite file.
[native.database.main]
backend = "sqlite"
url_env = "FLYCO_DATABASE_URL"

[cloudflare]
name = "flyco"
compatibility_date = "2026-08-01"

[cloudflare.vars]
FLYCO_GITHUB_CLIENT_ID = "TO-BE-PROVISIONED"
FLYCO_REDIRECT_URI = "TO-BE-PROVISIONED"

[cloudflare.service.auth_kv]
binding = "AUTH_KV"

[cloudflare.service.transcripts]
binding = "TRANSCRIPTS"

[cloudflare.service.provisioning]
binding = "PROVISIONING"

[cloudflare.database.main]
binding = "DB"

[[cloudflare.kv_namespaces]]
binding = "AUTH_KV"
id = "TO-BE-PROVISIONED"

[[cloudflare.r2_buckets]]
binding = "TRANSCRIPTS"
bucket_name = "flyco-transcripts"

[[cloudflare.d1_databases]]
binding = "DB"
database_name = "flyco-main"
database_id = "TO-BE-PROVISIONED"

# The Worker is both ends of the provisioning queue: `POST /v1/sessions`
# produces through the `PROVISIONING` binding, and the exported `queue` handler
# consumes from the same queue.
[[cloudflare.queues.producers]]
binding = "PROVISIONING"
queue = "flyco-provisioning"

# One invocation at a time, because two deliveries of the same job racing each
# other is the one case the machine row's UNIQUE index cannot arbitrate on D1,
# which has no transactions. The retries are an infrastructure backstop only:
# the consumer counts its own attempts inside the job and re-enqueues, so a
# provision that keeps failing ends as a visibly failed session rather than as
# a message Cloudflare quietly stops redelivering.
[[cloudflare.queues.consumers]]
queue = "flyco-provisioning"
max_batch_size = 1
max_concurrency = 1
max_retries = 3

# One Durable Object per session: the live relay room. The daemon holds one
# hibernating socket tagged `daemon`, browsers hold sockets tagged `client`,
# and the room forwards between them. It is addressed by the session id
# (`get_by_name`), so a session and its room are the same identity.
#
# The class name is `SessionRoomObject`, not `SessionRoom`:
# `#[skyzen::durable_object]` on a struct `T` exports the JS class as
# `TObject`, and the binding must name what is exported.
[[cloudflare.durable_objects.bindings]]
name = "SESSION_ROOMS"
class_name = "SessionRoomObject"

[[cloudflare.durable_objects.migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoomObject"]
