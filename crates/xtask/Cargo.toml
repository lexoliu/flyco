[package]
name = "xtask"
description = "Flyco workspace automation: the cargo-xtask command runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The wire version this publish couples the daemon and the Worker on comes
# from the same constant both planes compile against, never from a literal.
flyco-core.workspace = true

anyhow.workspace = true
askama.workspace = true
cargo_metadata.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
sha2.workspace = true
shell-escape.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true
# The same HTTP client the daemon uses, with the native TLS backend: the
# publish reads `/v1/healthz` and the served checksums over TLS.
zenwave = { workspace = true, features = ["hyper-rustls"] }

[lints]
workspace = true
