[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
enabled = true
required = false

[mcp_servers.deepwiki.http_headers]
authorization = "Bearer a-registered-token"

[mcp_servers.flyco]
command = "/usr/local/bin/flycod"
args = [
    "mcp",
    "--config",
    "/etc/flyco/flycod.toml",
]
enabled = true
required = true

[mcp_servers.git]
command = "bunx"
args = [
    "-y",
    "@modelcontextprotocol/server-git",
]
enabled = true
required = false

[mcp_servers.git.env]
GIT_DIR = "/srv/flyco/work/.git"
