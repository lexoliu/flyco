[package]
name = "flyco-daemon"
description = "flycod: the flyco execution-plane daemon — harness drivers, approvals, and transcript persistence on the session VM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "flycod"
path = "src/main.rs"

[dependencies]
# `schemars` puts a JSON schema on `computer_input`'s `DesktopInputEvent`
# arguments, so the tool the MCP server publishes describes them rather
# than accepting an untyped blob.
flyco-core = { workspace = true, features = ["schemars"] }
# `flycod host` runs exactly what the control plane planned: the container
# jobs, the two host wire enums and the rendered podman scripts all come from
# `flyco_provider::host`, so the machine cannot disagree with the planner
# about what a job is or how it is quoted.
flyco-provider.workspace = true
# The generic harness driver: every agent but Claude Code is an ACP
# process. `aither-mcp` is the JSON-RPC types the client handler returns
# errors in.
aither-acp.workspace = true
aither-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zenwave = { workspace = true, features = ["hyper-rustls"] }
eventsource-stream.workspace = true

askama.workspace = true
base64.workspace = true
clap.workspace = true
futures-core.workspace = true
futures-util.workspace = true
portable-pty.workspace = true
rmcp.workspace = true
rand.workspace = true
rust-embed.workspace = true
# A handoff patch is verified against its manifest's SHA-256 before `git
# apply` sees it.
sha2.workspace = true
hex.workspace = true
# `statvfs(3)`, for the one number an enrolled host cannot state without a
# syscall: how much room is left where Podman keeps its containers and
# volumes. Parsing `df` output would be the same fact, read out of a table
# whose columns are a locale away from moving.
rustix.workspace = true
# Codex's `auth.json` stamps `last_refresh` as an RFC 3339 instant, so the
# daemon needs a calendar to write one. `parsing` is the other direction:
# an eviction notice publishes its deadline as an instant too — RFC 1123 on
# Azure, RFC 3339 on EC2 — and the countdown is that deadline minus now.
time = { workspace = true, features = ["std", "parsing"] }
tokio.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# The desktop's capture and hands: X11 protocol plus the XTEST extension
# that injects input. Pure Rust, so the same module compiles on macOS —
# where it simply finds no X server to claim.
x11rb = { version = "0.13", features = ["xtest"] }
# The stream's encoder. `asm` stays off: the nasm toolchain it needs is
# not a provisioned dependency, and the software path is already fast
# enough at the stream's few-frames-a-second cadence.
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
# The agent's screenshots: PNG is what harnesses accept as image
# content, and the encoder is a leaf with no C.
png = "0.18"

[dev-dependencies]
# `tests/provisioned_config.rs` pins the configuration a provisioner writes
# against the loader that reads it. `testing` publishes the bootstrap
# fixtures every driver's own tests are written against, so the machine a
# test bootstrap describes is described in exactly one place.
flyco-provider = { workspace = true, features = ["testing"] }

[lints]
workspace = true
