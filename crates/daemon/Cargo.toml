[package]
name = "flyco-daemon"
description = "flycod: the flyco execution-plane daemon — harness drivers, approvals, and transcript persistence on the session VM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "flycod"
path = "src/main.rs"

[dependencies]
flyco-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
zenwave.workspace = true

clap.workspace = true
futures-util.workspace = true
rand.workspace = true
rust-embed.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tokio-tungstenite = { workspace = true, features = ["handshake"] }
# `tests/provisioned_config.rs` pins the configuration a provisioner writes
# against the loader that reads it. The `ssh` feature stays off: the daemon
# needs the renderer, not an SSH client.
flyco-provider.workspace = true

[lints]
workspace = true
