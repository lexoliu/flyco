# flycod configuration — the developer-machine shape.
#
# `flycod example-config` prints this file. On a provisioned session VM the
# paths point into /srv and /var/lib and `[claude.auth]` injects a
# credential; the only mode that reads the host user's own ~/.claude is
# `inherit`, below, which exists so flyco can be driven against a real login
# on a developer's laptop.

# The flyco session this daemon serves.
session = "9d0f4b1a-3b7e-4a3e-9e1a-4c2f8b6d7a10"

# Which harness to drive: "claude_code" or "codex".
harness = "claude_code"

# Where the agent works.
workdir = "/tmp/flycod-dev/work"

# Who chose the machine this session runs on: "auto" (flyco picked the
# cheapest curated Linux type big enough) or "user" (the machine was named
# on the request). The agent is told which, and told to leave a machine the
# user chose alone unless the task cannot proceed on it.
machine_origin = "auto"

# What kind of machine this daemon is on: "vm" (a virtual machine whose disk
# is still there after a stop) or "container" (a managed container whose
# filesystem ends with the execution). It decides what SIGTERM means: on a
# container the daemon spends the platform's grace period writing the
# working tree out as the session's workdir patch, because nothing else will
# survive. Omitted means "vm", which is what a developer machine is.
runtime = "vm"

# Root of the local append-only transcript store, used when there is no
# [control_plane] below. A session that reports to a control plane keeps its
# transcript in R2 instead — that is what lets it resume onto any machine.
transcript_dir = "/tmp/flycod-dev/transcripts"

# Harness-native session id to resume. Omit to start a fresh session.
# resume_session_id = "1f6d2c50-8a4b-4a2b-9f6d-2c508a4b4a2b"

# Where to report to. Present on a provisioned session VM; omitted here, so
# `flycod run` drives the session from its stdin REPL instead. Which mode a
# run chose is logged at startup.
#
# `daemon_token` is minted by `POST /v1/sessions/{id}/daemon-token` and is
# the only credential that opens this session's daemon-scoped routes.
# [control_plane]
# url = "https://flyco.dev/"
# daemon_token = "fd_a-token-from-the-control-plane"

# The repository to clone into `workdir` before the harness starts. Present
# on a provisioned session VM; omitted here, so `flycod run` works in
# whatever `workdir` already holds — which is what a developer wants when
# they are reproducing a harness bug in a checkout they already have.
#
# `token` is the user's own GitHub token: flyco behaves as the user rather
# than as a bot, so the clone and any push the agent makes are theirs. It
# reaches git through a credential helper that reads it from the environment
# of one child process, and is therefore never written into the remote URL,
# into .git/config, or into a log line.
# [repo]
# slug = "lexoliu/flyco"
# branch = "dev"
# token = "gho_a-user-access-token"
# identity = { name = "lexoliu", email = "4242+lexoliu@users.noreply.github.com" }
# The machine this daemon booted on, as the agent is told about it. Written
# by the provisioner from the curated catalog entry the machine was created
# from, and not rewritten afterwards: a resize restarts the machine without
# touching this file, and the live answer is what `machine_status` reads
# from the control plane.
[machine]
machine_type = "Standard_D4s_v6"

# What one hour costs, in integer microdollars (1 USD = 1e6). Omit on
# hardware the user owns, which flyco does not meter at all.
hourly = 190000

# Whether the machine holds interruptible spot capacity.
spot = true

# How big it is. Omit for a machine flyco has never measured.
[machine.capacity]
vcpus = 4
memory_mib = 16384

# What the provider billed the moment the machine booted, for a
# license-bound type such as an EC2 Mac. Omit for every type with no floor.
# [machine.minimum]
# hours = 24
# charge = 15600000

[claude]
# Model override, written by the control plane from the model the session
# was opened on. It is the identifier the Agent SDK's own model list names —
# "default", "opus[1m]", "sonnet", "claude-fable-5-1[1m]" — passed through
# verbatim. Omit to leave the CLI's own default in place.
# model = "sonnet"

# Reasoning effort for that model: "low", "medium", "high", "xhigh" or
# "max". Omit to leave the CLI's own default for the model in place; a model
# that accepts no effort levels at all (Haiku) never carries one.
# effort = "high"

# Spelled the way the Agent SDK spells it: "default", "acceptEdits",
# "bypassPermissions", or "plan". Anything but "default" narrows what
# reaches flyco's approval UI, because auto-approved tools never call back.
permission_mode = "default"

# Claude Code's managed-policy directory, "/etc/claude-code" on a
# provisioned machine. flycod writes managed-settings.json and
# managed-mcp.json there: root-owned files that outrank every other settings
# source and hold the MCP allowlist, so the agent cannot add a server or
# remove flyco's. Omitted here because a developer's flycod is not root and
# the host's own managed policy is not flyco's to overwrite — the session's
# servers are still mounted through the Agent SDK, but nothing is enforced.
# managed_dir = "/etc/claude-code"

[claude.auth]
# "inherit"      — no CLAUDE_CONFIG_DIR, no credential injection. Developer
#                  machines only: the CLI reads the host user's ~/.claude.
# "oauth_token"  — token = "…", isolation = { config_dir, project_dir_name }
# "api_key"      — key   = "…", isolation = { config_dir, project_dir_name }
mode = "inherit"

[sidecar]
# Where the embedded Bun sidecar is written and `bun install` is run.
dir = "/tmp/flycod-dev/sidecar"

# The bun executable; a bare name is resolved through PATH.
bun = "bun"

# The user's registered MCP servers, written by the provisioner from
# `GET /v1/mcp-servers`. This is the whole set the session gets beside
# flyco's own local server, and it is an allowlist rather than a suggestion:
# flycod renders it into the harness's root-owned MCP configuration, which
# the agent's user cannot write. Last in the file because an array of tables
# closes the document.
#
# [[mcp_servers]]
# name = "git"
# config = { transport = "stdio", command = "bunx", args = ["-y", "@modelcontextprotocol/server-git"], env = [{ key = "GIT_DIR", value = "/srv/flyco/work/.git" }] }
#
# [[mcp_servers]]
# name = "deepwiki"
# config = { transport = "http", url = "https://mcp.deepwiki.com/mcp", headers = [{ name = "authorization", value = "Bearer a-registered-token" }] }
