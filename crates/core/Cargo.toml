[package]
name = "flyco-core"
description = "Shared domain model for flyco: typed ids, money, budget engine, session lifecycle, harness events, and the daemon⇄control-plane wire protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Desktop stream chunks are byte strings crossing JSON: base64 is the
# wire form [`wire::base64_bytes`] puts on them.
base64.workspace = true
# Optional because the JSON-schema surface exists for one consumer — the
# `computer_input` MCP tool describes its `Vec<DesktopInputEvent>` argument
# with a schemars schema — and flyco-api, which compiles this crate to wasm,
# pays for the derive on every build it is left on.
schemars = { version = "1.2", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
utoipa.workspace = true

# Only the control plane stores the domain model, and only it may pay for a
# web framework. `FromColumn` is skyzen's and these types are flyco's, so the
# orphan rule puts the mapping here and nowhere else; the feature is what
# keeps `flycod`, which shares this crate and touches no database, from
# linking skyzen.
skyzen = { workspace = true, optional = true }
# The traits the mapping is written against. `#[derive(skyzen::Column)]`
# reaches them through `skyzen`; the two hand-written impls that no derive can
# express — a phantom-typed id, a slug with a parser — name the crate itself.
skyzen-services = { workspace = true, optional = true }

[features]
# The SQL column mapping of the stored domain types. Enabled by flyco-api.
sql = ["dep:skyzen", "dep:skyzen-services"]
# `schemars::JsonSchema` on the desktop input wire types, so `flycod mcp`
# can publish a schema for `computer_input`'s arguments. Enabled by
# flyco-daemon.
schemars = ["dep:schemars"]

[dev-dependencies]

[lints]
workspace = true
