[package]
name = "flyco-cli"
description = "flyco: the flyco terminal client — native harness TUIs for humans, a --json surface for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "flyco"
path = "src/main.rs"

[dependencies]
flyco-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
zenwave = { workspace = true, features = ["hyper-rustls"] }
clap.workspace = true
dialoguer.workspace = true
open.workspace = true
rustix.workspace = true
tokio.workspace = true
futures-util.workspace = true
url.workspace = true

[dev-dependencies]
# `start_paused`/`advance`: the reconnect-ladder tests measure virtual
# waits instead of sleeping real seconds.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
