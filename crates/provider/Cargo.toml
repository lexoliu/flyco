[package]
name = "flyco-provider"
description = "Cloud provider abstraction for flyco: priced catalogs, provisioning, disk-preserving resize, and spot interruption handling over plain signed HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flyco-core.workspace = true
askama.workspace = true
aws-credential-types.workspace = true
aws-sigv4.workspace = true
base64.workspace = true
futures-timer.workspace = true
quick-xml.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true

# The SSH half of byo-ssh. Native only, and off by default: enabling it in a
# Cloudflare Worker build would pull a TCP client into a runtime that has no
# sockets, which is exactly the mistake the feature gate exists to prevent.
russh = { workspace = true, optional = true }
shell-escape = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen = "0.2"
# The Worker's own `fetch`. zenwave's Fetch backend feeds a request body
# through a Rust-driven `ReadableStream` that a Workers handler never pulls,
# so the future hangs (flyco #86); the runtime's fetch takes bytes.
worker = "0.7"
# Turns on the feature `rsa`'s transitive `getrandom` needs to compile for
# wasm32 at all. See the workspace manifest for why it is a dependency rather
# than a feature of one.
getrandom-0-2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zenwave = { workspace = true, features = ["hyper-rustls"] }

[features]
default = []
# Native execution of byo-ssh container jobs. See `byo_ssh::execute`.
ssh = ["dep:russh", "dep:shell-escape"]
# Publishes `testing`: the recorded transport and the recording timer this
# crate's own tests are written against. Enabled by dependents that test an
# `HttpTransport` caller of their own — the control plane's Anthropic OAuth
# client — and never by a deployed build.
testing = []
# Enables the one test that talks to a real Azure subscription and creates
# billable resources. Off by default, never enabled in CI, and the test is
# `#[ignore]`d on top — see `azure::tests` for what it needs.
azure-live = []
# The same, against a real AWS account: an instance, an EBS volume and an
# elastic IP, all billable. See `aws::tests` for what it needs.
aws-live = []
# The same, against a real GCP project: an instance and a persistent disk.
# See `gcp::tests` for what it needs.
gcp-live = []

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
