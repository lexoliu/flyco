#cloud-config
write_files:
  - path: {{ config_path }}
    permissions: '0600'
    owner: 'root:root'
    encoding: b64
    content: {{ config_base64 }}
runcmd:
  - ['curl', '--fail', '--silent', '--show-error', '--location', '--output', '/run/flycod-install.sh', {{ installer_url }}]
  - ['sh', '/run/flycod-install.sh']
  - ['systemctl', 'enable', '--now', 'flycod']
