[workspace]
members = ["crates/core", "crates/api", "crates/daemon", "crates/provider"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexoliu/flyco"
authors = ["Lexo Liu <me@lexo.cool>"]

[workspace.dependencies]
flyco-core = { path = "crates/core" }
flyco-provider = { path = "crates/provider" }

# Includes the Worker response fix from zen-rs/skyzen#38. Skyzen's traits and
# macros cross crate boundaries, so the family must come from one revision.
# Keep the exact revision until the next crates.io release contains it.
skyzen = { git = "https://github.com/zen-rs/skyzen", rev = "ee225eb24d94c36f923ecff14b42c5b6fbf9ad16" }
# Backend-free: `skyzen-services` defaults to every native sqlx driver
# (postgres, mysql, sqlite), and the Worker build has no business compiling
# any of them — its database is D1. The one target that needs a real driver,
# the native binary behind `skyzen dev` and the `openapi.json` export, names
# `sqlite` itself in `crates/api`. Declared here rather than per member
# because a member may not turn a workspace dependency's default features
# off, only leave them off.
skyzen-services = { git = "https://github.com/zen-rs/skyzen", rev = "ee225eb24d94c36f923ecff14b42c5b6fbf9ad16", default-features = false }
skyzen-test = { git = "https://github.com/zen-rs/skyzen", rev = "ee225eb24d94c36f923ecff14b42c5b6fbf9ad16" }
skyzen-cloudflare = { git = "https://github.com/zen-rs/skyzen", rev = "ee225eb24d94c36f923ecff14b42c5b6fbf9ad16" }
# Select the native TLS backend in native crates below. Keeping the shared
# dependency backend-free lets the Worker use Zenwave's built-in Fetch backend
# without compiling an inapplicable native TLS stack.
zenwave = { version = "0.5", default-features = false, features = ["ws"] }

# Provider drivers render structured documents — cloud-init YAML, podman
# scripts — from compiled templates rather than string concatenation, so a
# dropped field fails the build instead of emitting a broken document.
askama = "0.14"
# One timer that works on both sides: a real timer natively, `setTimeout` on
# the Worker. Provider polling loops honour `Retry-After` with it.
futures-timer = { version = "3", features = ["wasm-bindgen"] }
shell-escape = "0.1"
# Calendar arithmetic, for the one place flyco needs it: the start of the
# billing month a cloud provider meters against. No clock is read from it —
# the caller supplies the instant — so it compiles on wasm32 untouched.
time = { version = "0.3", default-features = false, features = ["formatting"] }

# AWS request signing. Hand-rolling SigV4 is a canonical-request specification
# with a dozen ways to be subtly wrong; these are the vendor's own crates and
# both compile on wasm32, so the driver builds an `HttpRequest`, has it
# signed, and sends it through the same transport as everything else.
aws-sigv4 = { version = "1.5", default-features = false, features = ["http1", "sign-http"] }
aws-credential-types = "1.2"
# EC2 speaks the AWS Query protocol and answers in XML — there is no JSON
# dialect of it — so one XML reader earns its place. Deserialization only:
# requests are form-encoded, never XML.
quick-xml = { version = "0.38", default-features = false, features = ["serialize"] }
# The RS256 half of a Google service-account assertion. `rsa` + `sha2` are
# pure Rust and sign without an RNG (PKCS#1 v1.5 is deterministic), which is
# what makes a minted assertion assertable in a test.
rsa = { version = "0.9", features = ["sha2"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", default-features = false, features = ["v4", "serde", "js"] }
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
futures-core = "0.3"

# Execution plane only (native). Nothing here may reach the Worker graph.
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rand = "0.9"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
russh = "0.63"
portable-pty = "0.9"
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
# `rustls-tls-native-roots` so the daemon trusts the host's CA bundle: a
# session VM's image is the only place the control plane's certificate
# chain can come from.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Auth stack: pure-Rust crypto and encodings, all verified on wasm32.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
getrandom = { version = "0.4", features = ["wasm_js"] }
# `rsa` reaches `getrandom` through the 0.2 line, which refuses to compile for
# wasm32 at all unless its `js` feature is on — a `compile_error!`, not a
# runtime failure. Nothing calls it (PKCS#1 v1.5 signing is deterministic and
# takes no RNG); this entry exists solely to turn that feature on, and it is
# scoped to the wasm32 target so a native build never sees it.
getrandom-0-2 = { package = "getrandom", version = "0.2", features = ["js"] }
hex = "0.4"
# GitHub signs every webhook delivery with HMAC-SHA256 over the raw body;
# `Mac::verify_slice` is the constant-time comparison that check needs.
hmac = { version = "0.12", default-features = false }
http = "1"
js-sys = "0.3"
sha2 = { version = "0.10", default-features = false }
url = { version = "2", features = ["serde"] }
jwt-compact = { version = "0.9.0-beta.1", default-features = false, features = ["p256", "std"] }
web-push-native = { version = "0.5", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
# The Worker is single-threaded and every driver is generic over its
# transport, so provider and control-plane futures are never sent across
# threads; demanding `Send` of them would force bounds wasm32 cannot use.
future_not_send = "allow"
