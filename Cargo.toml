[workspace]
members = ["crates/core", "crates/api", "crates/daemon", "crates/provider"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexoliu/flyco"
authors = ["Lexo Liu <me@lexo.cool>"]

[workspace.dependencies]
flyco-core = { path = "crates/core" }
flyco-provider = { path = "crates/provider" }

skyzen = "0.1.2"
skyzen-services = "0.1.0"
skyzen-test = "0.1.0"
skyzen-cloudflare = "0.1.1"
zenwave = "0.5"

# Provider drivers render structured documents — cloud-init YAML, podman
# scripts — from compiled templates rather than string concatenation, so a
# dropped field fails the build instead of emitting a broken document.
askama = "0.14"
# One timer that works on both sides: a real timer natively, `setTimeout` on
# the Worker. Provider polling loops honour `Retry-After` with it.
futures-timer = { version = "3", features = ["wasm-bindgen"] }
shell-escape = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", default-features = false, features = ["v4", "serde", "js"] }
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
futures-core = "0.3"

# Execution plane only (native). Nothing here may reach the Worker graph.
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rand = "0.9"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
russh = "0.63"
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
# `rustls-tls-native-roots` so the daemon trusts the host's CA bundle: a
# session VM's image is the only place the control plane's certificate
# chain can come from.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Auth stack: pure-Rust crypto and encodings, all verified on wasm32.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
getrandom = { version = "0.4", features = ["wasm_js"] }
hex = "0.4"
js-sys = "0.3"
sha2 = { version = "0.10", default-features = false }
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
