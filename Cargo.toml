[workspace]
members = ["crates/flyco-core", "crates/flyco-api", "crates/flyco-provider"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexoliu/flyco"
authors = ["Lexo Liu <me@lexo.cool>"]

[workspace.dependencies]
flyco-core = { path = "crates/flyco-core" }
flyco-provider = { path = "crates/flyco-provider" }

skyzen = "0.1.2"
skyzen-services = "0.1.0"
skyzen-test = "0.1.0"
skyzen-cloudflare = "0.1.1"
zenwave = "0.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", default-features = false, features = ["v4", "serde", "js"] }
utoipa = { version = "5.4", default-features = false, features = ["macros"] }
futures-core = "0.3"

# Auth stack: pure-Rust crypto and encodings, all verified on wasm32.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
cookie = { version = "0.18", features = ["percent-encode"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
hex = "0.4"
js-sys = "0.3"
sha2 = { version = "0.10", default-features = false }
url = "2"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
